[package]
name = "ask-bridge"
version = "1.1.0"
edition = "2024"
description = "Gemini 专用 Edge 中文校对工具，直接 CDP、单一可执行文件"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
